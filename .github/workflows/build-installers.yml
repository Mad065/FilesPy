name: Build Multiplatform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: FilesPy-Windows
          - os: macos-latest
            artifact_name: FilesPy-macOS
          - os: ubuntu-latest
            artifact_name: FilesPy-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow certifi

      - name: Generate App Icons
        run: |
          python packaging/icon_generator.py

      # ----------------------------------------------------
      # Windows Build & Inno Setup
      # ----------------------------------------------------
      - name: Build Windows Executable & Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller packaging/FilesPy.spec --clean --noconfirm
          if (-not (Test-Path -Path "installer_output")) {
              New-Item -ItemType Directory -Path "installer_output" | Out-Null
          }
          Compress-Archive -Path "dist\FilesPy\*" -DestinationPath "installer_output\FilesPy-Windows-x64.zip" -Force
          
      - name: Compile Windows Inno Setup Installer
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/inno_setup.iss

      # ----------------------------------------------------
      # macOS Build & DMG Creation
      # ----------------------------------------------------
      - name: Build macOS App & DMG
        if: runner.os == 'macOS'
        run: |
          pyinstaller packaging/FilesPy.spec --clean --noconfirm
          mkdir -p installer_output dist/dmg_staging
          cp -R "dist/FilesPy.app" "dist/dmg_staging/"
          ln -s /Applications "dist/dmg_staging/Applications"
          hdiutil create -volname "FilesPy" -srcfolder "dist/dmg_staging" -ov -format UDZO "installer_output/FilesPy-macOS.dmg"
          cd dist && zip -r -q "../installer_output/FilesPy-macOS.zip" "FilesPy.app"

      # ----------------------------------------------------
      # Linux Build & Archive
      # ----------------------------------------------------
      - name: Build Linux Binary & Tarball
        if: runner.os == 'Linux'
        run: |
          pyinstaller packaging/FilesPy.spec --clean --noconfirm
          mkdir -p installer_output
          cp packaging/FilesPy.desktop dist/FilesPy/
          cp assets/icons/app_icon.png dist/FilesPy/filespy.png
          cat << 'EOF' > dist/FilesPy/install.sh
          #!/usr/bin/env bash
          set -e
          TARGET_DIR="$HOME/.local/share/filespy"
          mkdir -p "$TARGET_DIR" "$HOME/.local/bin" "$HOME/.local/share/applications" "$HOME/.local/share/icons/hicolor/512x512/apps"
          cp -r ./* "$TARGET_DIR/"
          ln -sf "$TARGET_DIR/FilesPy" "$HOME/.local/bin/filespy"
          cp "$TARGET_DIR/filespy.png" "$HOME/.local/share/icons/hicolor/512x512/apps/filespy.png"
          sed -i "s|Exec=FilesPy|Exec=$HOME/.local/bin/filespy|g" "$TARGET_DIR/FilesPy.desktop"
          cp "$TARGET_DIR/FilesPy.desktop" "$HOME/.local/share/applications/filespy.desktop"
          echo "FilesPy instalado exitosamente en $TARGET_DIR."
          EOF
          chmod +x dist/FilesPy/install.sh
          cd dist && tar -czf "../installer_output/FilesPy-Linux-x64.tar.gz" FilesPy

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: installer_output/*

  release:
    name: Publish Release Packages
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_installers
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_installers/*
          generate_release_notes: true
